# Databricks Asset Bundle: pipeline Medallion de preços de combustíveis (ANP).
# Autenticação: perfil do Databricks CLI (`databricks auth login`) ou variáveis de ambiente
# DATABRICKS_HOST / DATABRICKS_TOKEN. Nenhum host ou token fica neste arquivo.
bundle:
  name: anp-combustiveis-medallion

variables:
  catalog:
    description: Catalog do Unity Catalog. No Free Edition o padrão é `workspace`.
    default: workspace
  schema:
    description: Schema que guarda o Volume e as tabelas bronze, silver e gold.
    default: anp_combustiveis

resources:
  schemas:
    anp:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: Preços de combustíveis da ANP (arquitetura Medallion)

  volumes:
    raw:
      name: raw
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.anp.name}
      volume_type: MANAGED
      comment: CSVs brutos da ANP em raw/anp/<ano>/

  jobs:
    anp_medallion:
      name: anp-medallion-pipeline
      description: Encadeia bronze -> silver -> gold.
      max_concurrent_runs: 1
      # Sem bloco de cluster: as tarefas de notebook rodam em compute serverless,
      # que é o único disponível no Free Edition.
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              full_refresh: "false"

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

      # Para agendar (exemplo: todo dia 1 às 06:00, horário de São Paulo), descomente:
      # schedule:
      #   quartz_cron_expression: "0 0 6 1 * ?"
      #   timezone_id: America/Sao_Paulo

targets:
  dev:
    default: true
