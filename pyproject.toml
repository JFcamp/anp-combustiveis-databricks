[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Notebooks do Databricks usam `spark` e `dbutils` (injetados) e ajustam o sys.path antes dos imports.
[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F821", "E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
